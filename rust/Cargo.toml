[package]
name = "skyla_core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native core for Reforge (Skyla NetHunter), exposed to Kotlin via UniFFI."

[lib]
name = "skyla_core"
# cdylib -> libskyla_core.so for Android (loaded by JNA at runtime);
# staticlib is handy for host tooling / future iOS.
crate-type = ["cdylib", "staticlib"]

# Library-mode bindgen: `cargo run --bin uniffi-bindgen -- generate --library <lib> ...`
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
# Lightweight regex for the recon command denylist. regex-lite has no Unicode
# tables, keeping the .so small; the denylist patterns are plain ASCII.
regex-lite = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# NOTE: do NOT set panic = "abort" — UniFFI relies on catch_unwind to turn a
# Rust panic into a clean error across the FFI boundary instead of killing the app.
